<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="chat-page">
    <aside class="sidebar">
        <div>
            <p class="eyebrow">Workspace</p>
            <h1>AI Chatbot</h1>
        </div>

        <div class="sidebar-actions">
            <button type="button" onclick="newChat()">New Chat</button>
        </div>
    </aside>

    <main class="chat-shell">
        <header class="chat-header">
            <div>
                <p class="eyebrow">Ollama assistant</p>
                <h2>How can I help?</h2>
            </div>
            <div class="header-actions">
                <span class="status-pill">Local model</span>
                <div class="settings">
                    <button
                        class="icon-button"
                        type="button"
                        aria-label="Settings"
                        title="Settings"
                        onclick="toggleSettings()"
                    >
                        &#9881;
                    </button>
                    <div id="settingsMenu" class="settings-menu" hidden>
                        <a href="{{ url_for('logout') }}">Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <section id="chat" class="chat-box" aria-live="polite"></section>

        <form class="input-area" onsubmit="event.preventDefault(); sendMessage();">
            <div class="upload-panel">
                <label class="upload-button" for="fileInput">Attach file/photo</label>
                <input id="fileInput" type="file" accept="image/*,.txt,.py,.js,.html,.css,.json,.md,.csv,.pdf,.doc,.docx" onchange="uploadFile()">
                <span id="uploadStatus">No file selected</span>
            </div>

            <textarea
                id="msg"
                rows="3"
                placeholder="Ask anything, or paste a large program to fix..."
                autocomplete="off"
                onkeydown="handleKey(event)"
            ></textarea>
            <button id="sendButton" type="submit">Send</button>
        </form>
    </main>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
